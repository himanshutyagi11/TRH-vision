{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | tVision Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-orange fs-3" href="{% url 'index' %}">tVision<span class="text-dark">.</span></a>
        <a class="btn btn-outline-dark rounded-pill px-4" href="{% url 'signup' %}">Create Account</a>
    </div>
</nav>

<main class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p class="text-muted small">Access your analytics dashboard or internship portal</p>
                </div>

                <form action="{% url 'signup' %}" method="POST">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small">First Name</label>
                            <input type="text" name="fname" class="form-control bg-light border-0" placeholder="John" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small">Last Name</label>
                            <input type="text" name="lname" class="form-control bg-light border-0" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email Address</label>
                        <input type="email" name="email" class="form-control bg-light border-0" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Password</label>
                        <input type="password" name="pass1" class="form-control bg-light border-0" placeholder="••••••••" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Confirm Password</label>
                        <input type="password" name="pass2" class="form-control bg-light border-0" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-orange btn-lg w-100 rounded-pill shadow-sm py-3 fw-bold">
                        Create Account <i class="bi bi-person-plus ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling.querySelector('i');
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle('bi-eye');
        icon.classList.toggle('bi-eye-slash');
    }
</script>
</body>
</html>
