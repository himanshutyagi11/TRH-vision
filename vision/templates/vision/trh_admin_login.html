{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | TRHvision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827 0%, #1f2937 50%, #111827 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 3rem 2.5rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            width: 100%; max-width: 420px;
        }
        .admin-badge {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff; font-size: 0.65rem; font-weight: 700;
            padding: 4px 12px; border-radius: 50px;
            letter-spacing: 1.5px; text-transform: uppercase;
        }
        .form-floating > .form-control {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; color: #fff; height: 56px;
        }
        .form-floating > .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
            color: #fff;
        }
        .form-floating > label { color: rgba(255,255,255,0.4); }
        .btn-admin {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none; border-radius: 14px; padding: 14px;
            font-weight: 700; color: #fff; width: 100%;
            transition: all 0.3s;
        }
        .btn-admin:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.35); color: #fff; }
        .alert { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
            <img src="{% static 'vision/image/logo.png' %}" alt="Logo" width="36" onerror="this.style.display='none'">
            <span style="font-size:1.4rem;font-weight:800;color:#fff;">TRHvision<span style="color:#6366f1;">.</span></span>
        </div>
        <span class="admin-badge mb-4 d-inline-block">🛡️ Admin Panel</span>
        <h5 class="text-white fw-bold mb-1">Admin Access</h5>
        <p class="text-white-50 small mb-4">Sign in with your staff credentials</p>

        {% if messages %}{% for message in messages %}
            <div class="alert py-2 mb-3 small">{{ message }}</div>
        {% endfor %}{% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                <label for="username"><i class="bi bi-person me-2"></i>Username / Email</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
            </div>
            <button type="submit" class="btn btn-admin"><i class="bi bi-shield-lock me-2"></i>Sign In</button>
        </form>
        <a href="{% url 'index' %}" class="d-block text-white-50 small mt-4 text-decoration-none">← Back to website</a>
    </div>
</body>
</html>
