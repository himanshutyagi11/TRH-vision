{% extends "vision/base.html" %}
{% load static %}

{% block content %}
<main class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 animate__animated animate__fadeInUp">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <h3 class="fw-bold mb-0">Reset Password</h3>
                </div>
                <div class="card-body p-4 p-md-5">
                    <p class="text-muted mb-4">Enter your email address and we'll send you a link to reset your
                        password.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="id_email" class="form-label fw-bold small text-muted">EMAIL ADDRESS</label>
                            <input type="email" name="email" id="id_email" class="form-control" required
                                placeholder="name@example.com">
                        </div>
                        <button type="submit" class="btn btn-orange text-white w-100 rounded-pill fw-bold">Send Reset
                            Link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
