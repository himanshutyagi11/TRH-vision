{% extends "vision/base.html" %}
{% load static %}

{% block content %}
<main class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 animate__animated animate__fadeInUp">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center">
                <div class="card-body p-5">
                    <div class="mb-4 text-success display-1">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-3">Password Changed!</h3>
                    <p class="text-muted mb-4">Your password has been set. You may go ahead and log in now.</p>

                    <a href="{% url 'sigin' %}"
                        class="btn btn-orange text-white rounded-pill px-5 fw-bold shadow-sm hover-up">Log In</a>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
